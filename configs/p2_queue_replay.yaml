run_name: lobster_aapl_queue

paths:
  results_dir: results
  data_dir: data
  lobster_dir: data/lobster

model:
  sigma: 1.0
  # At calibrated AAPL volatility, this skews about $0.0046 per share of inventory at the open.
  gamma: 0.0001
  kappa: 1.5
  A: 140.0
  T: 23400.0
  dt: 0.001
  initial_mid: 100.0

inventory:
  Q_max: 10

adverse_selection:
  enabled: true
  epsilon: 0.02

simulation:
  n_paths: 1000
  seed: 42
  backend: numpy

sweep:
  device: auto
  gamma_grid: [0.01, 0.05, 0.1, 0.5, 1.0]
  sigma_grid: [0.5, 1.0, 2.0]
  T_grid: [0.5, 1.0, 2.0]
  n_paths: 2000
  seed: 123

replay:
  orderbook_file: data/lobster/AAPL_2012-06-21_34200000_57600000_orderbook_10.csv
  message_file: data/lobster/AAPL_2012-06-21_34200000_57600000_message_10.csv
  use_calibrated_params: true
  session_duration_seconds: 23400.0
  post_only_mode: reprice
  latency_ms: 1.0

queue_model:
  enabled: true
  order_size: 1
  cancellation_rule: proportional
  arrival_rate_depth_coeff: 0.05
  cancel_rate_depth_coeff: 0.02
  fill_intensity_depth_coeff: 0.01
