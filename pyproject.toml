[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p2-market-maker"
version = "0.2.0"
description = "Avellaneda-Stoikov market maker research repo"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<2.3",
  "pandas>=2.1,<4",
  "pyarrow>=14,<23",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "seaborn>=0.13,<1",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
# Only the external replay cross-check imports this, and it imports it lazily,
# so installing and testing the package does not need the wheel.
external = [
  "hftbacktest==2.4.4",
]
gpu = [
  "torch>=2.2,<3",
]
fast = [
  "numba>=0.59,<1",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.11,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/render_readme_figures.py" = ["E402"]
"scripts/run_week_sweep.py" = ["E402"]
